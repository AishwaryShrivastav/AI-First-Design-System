name: Publish Storybook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storybook-pages.yml'
      - 'packages/core/**'
      - 'packages/tokens/**'
      - 'packages/storybook/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /AI-First-Design-System/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/storybook/storybook-static
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
